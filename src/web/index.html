<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1650ff" />
    <title>Ovo Timer</title>
    <link rel="icon" type="image/png" href="./assets/ovo-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="poster-background" aria-hidden="true"></div>
    <main class="app-shell">
      <section id="timerScreen" class="app-screen timer-screen" aria-label="Countdown timer">
        <div class="timer-layout">
          <div class="timer-panel">
            <div class="dial-zone">
              <div id="dialRim" class="dial-rim">
                <span class="selection-trace selection-trace-outer" aria-hidden="true"></span>
                <span class="selection-trace selection-trace-inner" aria-hidden="true"></span>
                <div
                  id="timerDial"
                  class="timer-dial"
                  aria-label="Countdown clock"
                  aria-description="Tap the clock face to start or pause. Drag the colored progress band around its edge to choose a duration. Each full turn adds 30 minutes, with a hard stop at 60 minutes. Reverse the drag to reduce the time."
                  aria-valuemin="0"
                  aria-valuemax="3600"
                  aria-valuenow="1500"
                  aria-valuetext="25 minutes"
                  tabindex="0"
                  role="slider"
                >
                  <span class="dial-progress" id="dialProgress">
                    <span class="dial-face">
                      <span id="timerValue" class="timer-value">25:00</span>
                      <span id="timerCaption" class="timer-caption">ON THE DIAL</span>
                    </span>
                  </span>
                </div>
              </div>
            </div>

            <p id="liveStatus" class="live-status visually-hidden" aria-live="polite">25 minutes is loaded.</p>
          </div>

          <aside class="side-panel" aria-label="One-tap countdown shortcuts">
            <section class="side-section">
              <div class="add-time" role="group" aria-labelledby="addStatus">
                <p id="addStatus">ADD TIME WHILE RUNNING</p>
                <div class="add-grid">
                  <button class="add-button" data-add-minutes="1" type="button" aria-label="Add 1 minute" disabled>+1 <span>MIN</span></button>
                  <button class="add-button" data-add-minutes="2" type="button" aria-label="Add 2 minutes" disabled>+2 <span>MIN</span></button>
                  <button class="add-button" data-add-minutes="3" type="button" aria-label="Add 3 minutes" disabled>+3 <span>MIN</span></button>
                </div>
              </div>
              <div class="preset-grid">
                <button class="preset preset-blue" data-minutes="1" type="button">01<br /><span>MIN</span></button>
                <button class="preset preset-yellow" data-minutes="2" type="button">02<br /><span>MIN</span></button>
                <button class="preset preset-orange" data-minutes="3" type="button">03<br /><span>MIN</span></button>
                <button class="preset preset-green" data-minutes="5" type="button">05<br /><span>MIN</span></button>
                <button class="preset preset-red" data-minutes="10" type="button">10<br /><span>MIN</span></button>
                <button class="preset preset-blue" data-minutes="15" type="button">15<br /><span>MIN</span></button>
                <button class="preset preset-yellow" data-minutes="20" type="button">20<br /><span>MIN</span></button>
                <button class="preset preset-orange" data-minutes="30" type="button">30<br /><span>MIN</span></button>
                <button class="preset preset-red" data-minutes="45" type="button">45<br /><span>MIN</span></button>
              </div>
              <button id="settingsButton" class="settings-button" type="button" aria-label="Open settings">
                <img src="./assets/settings-gear.png" alt="" aria-hidden="true" />
                <span>SETTINGS</span>
              </button>
            </section>
          </aside>
        </div>
      </section>

      <section id="settingsScreen" class="app-screen settings-screen" aria-labelledby="settingsTitle" hidden>
        <div class="settings-header">
          <button id="backButton" class="back-button" type="button">← BACK TO TIMER</button>
          <div>
            <p class="eyebrow">OVO//SETTINGS</p>
            <h1 id="settingsTitle">MAKE IT YOURS.</h1>
          </div>
        </div>

        <div class="settings-grid">
          <section class="settings-section appearance-section" aria-labelledby="appearanceTitle">
            <div class="settings-copy">
              <p class="eyebrow">APPEARANCE</p>
              <h2 id="appearanceTitle">CHOOSE A COLORWAY.</h2>
              <p>Eight bold palettes built for the timer.</p>
            </div>
            <div class="theme-options" role="group" aria-label="Color theme">
              <button class="theme-option theme-dark" data-theme-option="dark" type="button" aria-pressed="true">DARK MODE</button>
              <button class="theme-option theme-light" data-theme-option="light" type="button" aria-pressed="false">LIGHT MODE</button>
              <button class="theme-option theme-cobalt" data-theme-option="cobalt" type="button" aria-pressed="false">COBALT NIGHT</button>
              <button class="theme-option theme-acid" data-theme-option="acid" type="button" aria-pressed="false">ACID SIGNAL</button>
              <button class="theme-option theme-ocean" data-theme-option="ocean" type="button" aria-pressed="false">DEEP OCEAN</button>
              <button class="theme-option theme-ember" data-theme-option="ember" type="button" aria-pressed="false">HOT EMBER</button>
              <button class="theme-option theme-forest" data-theme-option="forest" type="button" aria-pressed="false">NIGHT FOREST</button>
              <button class="theme-option theme-mono" data-theme-option="mono" type="button" aria-pressed="false">MONOCHROME</button>
            </div>
          </section>
        </div>
        <p id="settingsStatus" class="settings-status" aria-live="polite">Dark mode selected.</p>
      </section>
    </main>
    <script src="./vendor/capacitor.js"></script>
    <script src="./vendor/local-notifications.js"></script>
    <script src="./vendor/ovo-alarm.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
